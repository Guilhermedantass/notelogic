<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="utf-8">
  <title>NoteLogic</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#543EFE">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block">
  <!-- Aplica o tema salvo antes do Angular carregar, para a tela não "piscar" clara e depois ficar escura -->
  <!-- ?tema=escuro na URL também funciona (e fica salvo): útil para mostrar ou testar um tema específico -->
  <script>
    var daUrl = new URLSearchParams(location.search).get('tema');
    if (daUrl === 'claro' || daUrl === 'escuro' || daUrl === 'sistema') localStorage.setItem('notelogic.tema', daUrl);
    document.documentElement.dataset.tema = localStorage.getItem('notelogic.tema') || 'claro';
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
