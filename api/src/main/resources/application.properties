spring.application.name=notelogic-api

# Quem cria e altera as tabelas é o Flyway (db/migration); o Hibernate só confere se as entidades batem com o banco
spring.jpa.hibernate.ddl-auto=validate
# Não deixa a conexão com o banco aberta durante a renderização da resposta
spring.jpa.open-in-view=false

# Ao parar a API, o container do banco continua rodando (o próximo start fica mais rápido)
spring.docker.compose.lifecycle-management=start-only
