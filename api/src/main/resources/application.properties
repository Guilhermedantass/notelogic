spring.application.name=notelogic-api

# Quem cria e altera as tabelas é o Flyway (db/migration); o Hibernate só confere se as entidades batem com o banco
spring.jpa.hibernate.ddl-auto=validate
# Não deixa a conexão com o banco aberta durante a renderização da resposta
spring.jpa.open-in-view=false

# Ao parar a API, o container do banco continua rodando (o próximo start fica mais rápido)
spring.docker.compose.lifecycle-management=start-only

# Fuso usado para decidir o que é "hoje" (fila de revisão, prazos, estatísticas)
notelogic.fuso=America/Sao_Paulo

# Segredo que assina os tokens JWT (HMAC-SHA256, no mínimo 32 bytes).
# Este valor é só para desenvolvimento: em produção, defina a variável de ambiente NOTELOGIC_JWT_SEGREDO.
notelogic.jwt.segredo=dev-only-troque-em-producao-0123456789abcdef
notelogic.jwt.validade=7d
